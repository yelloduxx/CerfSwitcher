name: Stability CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Repository checks
        run: |
          git diff --check
          bash -n scripts/*.sh
          python3 -m json.tool scripts/v4_training_sources.json >/dev/null
          gzip -t scripts/data/*.gz
          if grep -R -E 'RuSwitcherAX|com\.ruswitcher\.ax' scripts; then
            echo "Legacy AX test identity returned to production scripts" >&2
            exit 1
          fi
          bash scripts/lint_bound_contains.sh

      - name: Unit tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
          if ! grep -q "testDecoderPerformanceBudget\]' passed" "$RUNNER_TEMP/unit-tests.log"; then
            echo "::error title=Decoder budget not asserted::testDecoderPerformanceBudget did not pass its wall-clock budget"
            exit 1
          fi

      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Address sanitizer
        run: |
          set -o pipefail
          swift test --sanitize=address 2>&1 | tee "$RUNNER_TEMP/asan-tests.log"
          if ! grep -q "testDecoderPerformanceBudget\]' skipped" "$RUNNER_TEMP/asan-tests.log"; then
            echo "::error title=ASan budget skip missing::testDecoderPerformanceBudget did not report its AddressSanitizer skip"
            exit 1
          fi

      - name: Deterministic simulators
        run: |
          bash scripts/run_randomized_layout_suite.sh
          bash scripts/verify_simulator_negative_control.sh
          bash scripts/run_headless_typing_simulator.sh

      - name: Physical typing suite
        run: |
          status=0
          python3 scripts/run_physical_typing_suite.py || status=$?
          if [ "$status" -eq 77 ]; then
            echo "::error title=Physical typing suite blocked::required system keyboard layout is missing on this runner (exit 77); the negative controls, legacy-oracle isolation and Unicode-deletion safety checks did not run"
          fi
          exit "$status"

      - name: V3-only build check
        run: bash scripts/verify_v3_only_build.sh

      - name: Reproduce language model
        run: |
          python3 scripts/build_language_model.py \
            --output "$RUNNER_TEMP/language-model-v1.bin"
          cmp Sources/RuSwitcherCore/Resources/language-model-v1.bin \
            "$RUNNER_TEMP/language-model-v1.bin"

  release-build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Release unit tests
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee "$RUNNER_TEMP/release-tests.log"
          if ! grep -q "testDecoderPerformanceBudget\]' passed" "$RUNNER_TEMP/release-tests.log"; then
            echo "::error title=Decoder budget not asserted::testDecoderPerformanceBudget did not pass its wall-clock budget"
            exit 1
          fi

      - name: Release simulator
        run: |
          status=0
          swift run -c release RuSwitcherSimulator --jobs 4 \
            --output "$RUNNER_TEMP/simulator-release.json" >/dev/null || status=$?
          python3 - "$RUNNER_TEMP/simulator-release.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("words total={total} passed={passed} failed={failed}; "
                "phrases total={phraseTotal} passed={phrasePassed}".format(**report))
          PY
          exit "$status"

      - name: App bundle
        run: |
          RUSWITCH_UNSIGNED_BUNDLE=1 bash build_app.sh
          bash scripts/verify_v3_only_build.sh RuSwitcherPro.app
