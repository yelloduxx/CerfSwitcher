[package]
name = "ruswitcher_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"

# Standalone workspace: nothing in Package.swift or build_app.sh depends on it.
[workspace]
